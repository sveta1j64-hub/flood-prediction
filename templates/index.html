<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прогноз паводка</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Прогноз паводка</h1>
        <form method="POST">
            <label>Вход 0: <input type="number" step="any" name="input0" placeholder="-9999 если нет данных"></label>
            <label>Вход 1: <input type="number" step="any" name="input1" placeholder="-9999 если нет данных"></label>
            <label>Вход 2: <input type="number" step="any" name="input2" placeholder="-9999 если нет данных"></label>
            <label>Вход 3: <input type="number" step="any" name="input3" placeholder="-9999 если нет данных"></label>
            <button type="submit">Рассчитать</button>
        </form>
        {% if result is not none %}
            <div class="result">
                <h2>Прогнозируемое значение: {{ result }}</h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
