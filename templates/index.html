<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз паводка — г. Оренбург</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="overlay"></div>

    <div class="container">
        <h1>Прогноз высшего срочного уровня воды<br>по г. Оренбург (р. Урал)</h1>

        <div class="card form-card">
            <form method="POST">
                <div class="field">
                    <label>1. Уровни на притоке (село Истемес) в даты наступления высших уровней весеннего половодья на целевом створе (Оренбург):</label>
                    <input type="number" name="input0" placeholder="Введите значение или оставьте пустым" step="any">
                </div>
                <div class="field">
                    <label>2. Высшие уровни воды весеннего половодья (село Березовка):</label>
                    <input type="number" name="input1" placeholder="Введите значение или оставьте пустым" step="any">
                </div>
                <div class="field">
                    <label>3. Высшие уровни воды за декабрь (город Орск):</label>
                    <input type="number" name="input2" placeholder="Введите значение или оставьте пустым" step="any">
                </div>
                <div class="field">
                    <label>4. Низшие уровни воды за декабрь (город Орск):</label>
                    <input type="number" name="input3" placeholder="Введите значение или оставьте пустым" step="any">
                </div>
                <button type="submit">Предсказать</button>
            </form>
        </div>

        {% if result is not none %}
        <div class="card result-card">
            <h2>Результат прогноза:</h2>
            <p class="result-value">{{ result }} см</p>
        </div>
        {% endif %}

        <div class="card stats-card">
            <p><strong>Статистика прогнозов:</strong></p>
            <p><strong>Стандартная ошибка (RMSE):</strong> 82 см</p>
            <p><strong>Отношение RMSE к σ:</strong> 0.597</p>
            <p><strong>Отношение RMSE к σ<sub>Δ</sub>:</strong> 0.715</p>
        </div>

        <div style="text-align:center; margin-top: 10px;">
            <a href="/graphs" style="text-decoration:none; color:white; background:#27ae60; padding:12px 28px; border-radius:8px; font-size:1rem; font-weight:600;">📈 График прогнозов</a>
        </div>
    </div>
</body>
</html>
