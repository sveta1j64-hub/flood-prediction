<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз паводка — Великий Устюг</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="overlay"></div>

    <div class="container">
        <h1>Прогноз высшего срочного уровня воды<br>по г. Великий Устюг</h1>

        <div class="card form-card">
            <form method="POST">
                <div class="field">
                    <label>1. Среднесуточный уровень вод, приходящийся на первый день ледохода по г. Великий Устюг:</label>
                    <input type="number" name="input0" placeholder="Введите значение или оставьте пустым" step="any">
                </div>
                <div class="field">
                    <label>2. Минимальный срочный уровень воды за декабрь по г. Великий Устюг:</label>
                    <input type="number" name="input1" placeholder="Введите значение или оставьте пустым" step="any">
                </div>
                <div class="field">
                    <label>3. Среднесуточный уровень воды по с. Кичменский Городок на дату начала ледохода в г. Великий Устюг:</label>
                    <input type="number" name="input2" placeholder="Введите значение или оставьте пустым" step="any">
                </div>
                <div class="field">
                    <label>4. Дополнительный параметр:</label>
                    <input type="number" name="input3" placeholder="Введите значение или оставьте пустым" step="any">
                </div>
                <button type="submit">Предсказать</button>
            </form>
        </div>

        {% if result is not none %}
        <div class="card result-card">
            <h2>Результат прогноза:</h2>
            <p class="result-value">{{ result }} см</p>
        </div>
        {% endif %}

        <div class="card stats-card">
            <p><strong>Статистика прогнозов:</strong></p>
            <p><strong>Стандартная ошибка (RMSE):</strong> 82.0</p>
            <p><strong>Отношение RMSE к σ:</strong> 0.597</p>
            <p><strong>Отношение RMSE к σ<sub>Δ</sub>:</strong> 0.715</p>
        </div>
    </div>
</body>
</html>
